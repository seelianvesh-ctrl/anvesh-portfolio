# Netlify build configuration.
#
# NOTE: values here OVERRIDE anything set in the Netlify UI. These are the
# settings the site was already deploying with; adding this file just makes them
# version-controlled and reproducible. If a deploy ever fails after this file
# appears, deleting it restores the previous UI-driven behaviour.

[build]
  # Regenerates the resume PDF, then builds the site.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# The SPA fallback and the clean source links (/linkedin, /email, /job, /resume)
# live in public/_redirects and are copied into dist, so Netlify picks them up
# from the publish directory. No duplicate redirect block here.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed build assets are safe to cache permanently.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Article pages are hand-written HTML, so they get revalidated rather than
# pinned. The hashed CSS they link is served with a long cache by the rule above.
[[headers]]
  for = "/articles/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
